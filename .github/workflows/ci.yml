name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: cd apps/backend && MONGO_URL=mongodb://127.0.0.1:27017/trading-ci JWT_SECRET=ci-test-secret CREDENTIAL_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= bun run test:integration
      - run: bun run lint
      - run: bun run check-types
      - run: bun run build --filter=client

  deployment-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build deployment topology
        env:
          JWT_SECRET: ci-test-secret
          CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          docker compose -f deploy/docker-compose.yml config >/tmp/trading-compose.yml
          docker compose -f deploy/docker-compose.yml build
      - name: Start services and probe readiness
        env:
          JWT_SECRET: ci-test-secret
          CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/readyz
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3001/readyz
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost/
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Tear down deployment stack
        if: always()
        env:
          JWT_SECRET: ci-test-secret
          CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose -f deploy/docker-compose.yml down -v
